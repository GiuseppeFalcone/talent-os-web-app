<div class="flex min-h-[calc(100vh-10rem)] flex-col items-center justify-center p-8 text-center">
  <div class="mb-6 rounded-full bg-surface-100 p-8 dark:bg-surface-800">
    <i class="pi pi-compass text-6xl text-surface-500"></i>
  </div>

  <h1 class="mb-2 text-4xl font-bold text-surface-900 dark:text-surface-50">404 - Page Not Found</h1>

  <p class="mb-8 max-w-md text-lg text-surface-600 dark:text-surface-400">
    The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
  </p>

  <div class="flex gap-4">
    <p-button label="Go Back" icon="pi pi-arrow-left" [outlined]="true" severity="secondary" (onClick)="goBack()" />

    <p-button label="Go to Dashboard" icon="pi pi-home" routerLink="/dashboard" />
  </div>
</div>
