<nav class="sticky top-0 z-50 dark:border-surface-700 bg-surface-0/70 dark:bg-surface-900/70 backdrop-blur-md">
  @let loggedIn = isLoggedIn();
  @let user = currentUser();
  @let menuItems = userMenuItems();
  @let modeIcon = theme.modeIcon();
  @let modeLabel = theme.modeLabel();

  <div class="mx-auto flex h-16 justify-between max-w-7xl items-center px-4 sm:px-6 lg:px-8">
    <div class="flex items-center">
      <a routerLink="/" class="flex items-center gap-2 transition-opacity duration-200 hover:opacity-80"
        aria-label="EasyCV home">
        <span class="text-2xl text-primary">
          <i class="pi pi-sparkles"></i>
        </span>
        <span class="text-lg font-bold tracking-tight text-primary">
          EasyCV
        </span>
      </a>
    </div>

    <div class="flex items-center gap-1 sm:gap-2">
      @if (loggedIn && user) {
      <p-button routerLink="/dashboard" icon="pi pi-home" [text]="true" [rounded]="true" aria-label="Dashboard" />

      <p-button *appHasRole="['ADMIN', 'MANAGER', 'EMPLOYEE', 'SUPERADMIN']" routerLink="/cv" label="Your CV"
        icon="pi pi-id-card" [text]="true" [rounded]="true" />
      <p-button *appHasRole="['MANAGER']" routerLink="/employees" label="Employees" icon="pi pi-users" [text]="true"
        [rounded]="true" />
      <p-button *appHasRole="['ADMIN', 'SUPERADMIN']" routerLink="/domains" label="Domains" icon="pi pi-shield"
        [text]="true" [rounded]="true" />
      <p-button *appHasRole="['ADMIN', 'SUPERADMIN']" routerLink="/manage-users" label="Users" icon="pi pi-sitemap"
        [text]="true" [rounded]="true" />
      }
    </div>

    <div class="flex items-center gap-2">
      @if (loggedIn && user) {
      <p-splitbutton [label]="user.firstName + ' ' + user.lastName" icon="pi pi-user" (onClick)="navigateToProfile()"
        [model]="menuItems" [text]="true" [rounded]="true" />
      } @else {
      <p-button label="Login" icon="pi pi-sign-in" (onClick)="navigateToLogin()" [text]="true" [rounded]="true" />
      }
      <p-button [icon]="modeIcon" [text]="true" [rounded]="true" (onClick)="theme.toggle()"
        [attr.aria-label]="'Switch to ' + modeLabel + ' mode'" />
    </div>
  </div>
</nav>
