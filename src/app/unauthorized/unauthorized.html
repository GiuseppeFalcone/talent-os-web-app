<div class="flex min-h-[calc(100vh-10rem)] flex-col items-center justify-center p-8 text-center">
  <div class="mb-6 rounded-full bg-red-100 p-8 dark:bg-red-900/30">
    <i class="pi pi-lock text-6xl text-red-500"></i>
  </div>
  <h1 class="mb-2 text-4xl font-bold text-surface-900 dark:text-surface-50">Access Denied</h1>
  <p class="mb-8 max-w-md text-lg text-surface-600 dark:text-surface-400">
    You do not have the necessary permissions to view this page. Please contact your administrator if you believe this
    is an error.
  </p>
  <div class="flex gap-4">
    <p-button label="Go Back" icon="pi pi-arrow-left" [outlined]="true" severity="secondary" (onClick)="goBack()" />
    <p-button label="Go to Dashboard" icon="pi pi-home" routerLink="/dashboard" />
  </div>
</div>
