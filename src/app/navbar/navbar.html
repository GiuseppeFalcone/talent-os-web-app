<nav class="sticky top-0 z-50 border-bottom-2 px-4 py-3 shadow-4 bg-white/70 dark:bg-gray-900/60 backdrop-blur-md">
  @let loggedIn = isLoggedIn();
  @let user = currentUser();
  @let menuItems = userMenuItems();
  @let modeIcon = theme.modeIcon();
  @let modeLabel = theme.modeLabel();

  <div class="mx-auto grid h-16 max-w-7xl grid-cols-3 items-center gap-4 px-4 sm:px-6 lg:px-8">
    <!-- Left: Logo -->
    <div class="flex items-center justify-start">
      <a routerLink="/" class="group flex items-center gap-2 transition-all duration-200" aria-label="EasyCV home">
        <span
          class="text-2xl text-primary-600 transition-transform duration-200 group-hover:scale-110 dark:text-primary-400">
          <i class="pi pi-sparkles"></i>
        </span>
        <span
          class="text-lg font-bold tracking-tight text-primary-600 transition-colors group-hover:text-primary-600 dark:text-surface-50 dark:group-hover:text-primary-400">
          EasyCV
        </span>
      </a>
    </div>

    <!-- Center: Navigation Actions -->
    <div class="flex items-end justify-center gap-1 sm:gap-2">
      <!-- Your CV -->
      <p-button *appHasRole="['ADMIN', 'MANAGER', 'EMPLOYEE', 'SUPERADMIN']" routerLink="/cv" label="Your CV"
        icon="pi pi-id-card" [raised]="true" styleClass="inline-flex shadow-2"
        [attr.aria-label]="'Navigate to your CV'" />

      <!-- Employees -->
      <p-button *appHasRole="['MANAGER']" routerLink="/employees" label="Employees" icon="pi pi-users" [raised]="true"
        styleClass="inline-flex shadow-2" [attr.aria-label]="'Manage employees'" />

      <!-- Domains -->
      <p-button *appHasRole="['ADMIN', 'SUPERADMIN']" routerLink="/domains" label="Domains" icon="pi pi-shield"
        [raised]="true" styleClass="inline-flex shadow-2" [attr.aria-label]="'Manage domains'" />

      <!-- Users -->
      <p-button *appHasRole="['ADMIN', 'SUPERADMIN']" routerLink="/users" label="Users" icon="pi pi-sitemap"
        [raised]="true" styleClass="inline-flex shadow-2" [attr.aria-label]="'Manage users'" />
    </div>

    <!-- Right: Auth + Theme -->
    <div class="flex items-end justify-end gap-1 sm:gap-2">
      @if (loggedIn && user) {
      <p-splitbutton [label]="user.firstName + ' ' + user.lastName" icon="pi pi-user" (onClick)="navigateToProfile()"
        [model]="menuItems" [raised]="true" styleClass="inline-flex shadow-2"
        [attr.aria-label]="'User menu for ' + user.firstName + ' ' + user.lastName" />
      } @else {
      <p-button type="button" label="Login" icon="pi pi-sign-in" [raised]="true" (onClick)="navigateToLogin()"
        styleClass="inline-flex shadow-2" aria-label="Login to your account" />
      }

      <p-button type="button" [icon]="modeIcon" [raised]="true" (onClick)="theme.toggle()" styleClass="ml-1 shadow-2"
        [attr.aria-label]="'Switch to ' + modeLabel + ' mode'" />
    </div>
  </div>
</nav>
